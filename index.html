<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>家族カレンダー</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header class="fc-header">
    <div class="fc-header-top">
      <h1 class="fc-app-title">家族カレンダー</h1>
      <h2 id="periodTitleMobile" class="fc-period-title-mobile"></h2>
      <div class="fc-header-top-actions">
        <button id="addEventBtn" type="button" class="fc-btn fc-btn-primary">＋ 予定を追加</button>
        <button id="settingsBtn" type="button" class="fc-btn fc-btn-secondary">⚙ 設定</button>
      </div>
    </div>
    <div class="fc-header-controls">
      <div class="fc-view-tabs" role="tablist">
        <button type="button" class="fc-tab-btn active" data-view="month">月表示</button>
        <button type="button" class="fc-tab-btn" data-view="week">週表示</button>
        <button type="button" class="fc-tab-btn" data-view="day">日表示</button>
      </div>
      <div class="fc-member-filter">
        <button id="memberFilterBtn" type="button" class="fc-btn fc-btn-secondary"></button>
        <div id="memberFilterPanel" class="fc-member-filter-panel" hidden></div>
      </div>
      <div class="fc-nav-controls">
        <button id="prevBtn" type="button" class="fc-btn fc-btn-secondary fc-nav-btn">◀</button>
        <button id="todayBtn" type="button" class="fc-btn fc-btn-secondary">今日</button>
        <button id="nextBtn" type="button" class="fc-btn fc-btn-secondary fc-nav-btn">▶</button>
      </div>
      <h2 id="periodTitle" class="fc-period-title"></h2>
    </div>
  </header>
  <main id="calendarBody" class="fc-calendar-body"></main>
</div>

<script src="js/utils.js"></script>
<script src="js/holidays.js"></script>
<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/sync.js"></script>
<script src="js/filter.js"></script>
<script src="js/modal.js"></script>
<script src="js/views/month.js"></script>
<script src="js/views/timeline.js"></script>
<script src="js/views/eventForm.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/memberFilter.js"></script>
<script src="js/app.js"></script>
</body>
</html>
